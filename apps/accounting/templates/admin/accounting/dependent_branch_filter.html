{% load i18n %}

<div class="form-group">
    <select class="form-control search-filter"
            style="width: 100%;"
            tabindex="-1"
            aria-hidden="true"
            data-name="{{ field_name }}"
            data-parent-filter="{{ spec.parent_filter }}"
            data-lookup="{{ spec.lookup_kwarg }}"
            data-branches-url="{{ spec.branches_url }}">
        <option value="">{{ title }}</option>
        <option value="">---------</option>
        {% for choice in choices %}
            {% if choice.name %}
                <option data-name="{{ choice.name }}" value="{{ choice.value }}" {% if choice.selected %}selected {% endif %}>
                    {{ choice.display }}
                </option>
            {% endif %}
        {% endfor %}
    </select>
</div>
