# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Keep the black / isort / flake8 revs equal to the pins in requirements/dev.txt
# so pre-commit and `make format` produce the same output.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
    -   id: black

-   repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
    -   id: isort

-   repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
    -   id: flake8

-   repo: https://github.com/dhruvmanila/remove-print-statements
    rev: v0.5.2
    hooks:
    -   id: remove-print-statements
        args: ['--verbose', '--ignore', 'config/settings.py']   # Show all the print statements to be removed
