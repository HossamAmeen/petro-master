# black and isort config. flake8 can't read this file, so its config lives in
# .flake8 — keep the line length and the excludes (venv, migrations,
# settings.py) the same in both.

[tool.black]
line-length = 88
# force-exclude also applies to files passed by name, which is how pre-commit
# calls black.
force-exclude = '''
/(
    venv
  | migrations
)/
| /settings\.py$
'''

[tool.isort]
profile = "black"
line_length = 88
extend_skip = ["venv", "migrations", "settings.py"]
# Apply the skips to files passed by name too (pre-commit).
filter_files = true

[tool.coverage.run]
# Measure the application code only; exclude tests, migrations, and config.
source = ["apps", "configrations"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "*/apps.py",
    "manage.py",
    "config/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
